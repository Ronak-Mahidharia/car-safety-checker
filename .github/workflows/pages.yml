name: Website

# Publishes the website to GitHub Pages: https://ronak-mahidharia.github.io/car-safety-checker/
# It runs after every merge to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job gets the two permissions GitHub requires to publish a site.
permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # Actions are pinned to exact commits, so a hijacked tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build the site for its address under /car-safety-checker/
        run: npm run build -- --base=/car-safety-checker/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the site, and nothing else
      id-token: write # prove to GitHub Pages that the site comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
